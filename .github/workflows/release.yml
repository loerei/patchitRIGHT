name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python {0}
        run: |
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              pkg_ver = tomllib.load(f)["project"]["version"]
          tag_ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert pkg_ver == tag_ver, f"Tag {tag_ver} != pyproject.toml version {pkg_ver}"

      - name: Install dependencies and run tests
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Build distribution packages
        run: uv build

      - name: Smoke-test built wheel
        run: |
          uvx --from dist/*.whl patchitright-mcp --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/patchitright-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
