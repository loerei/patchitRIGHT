[project]
name = "patchitright-mcp"
version = "0.1.0"
description = "AST-bounded safe search-and-replace and atomic multi-file edit MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "loerei", email = "sayusumat@gmail.com" },
]
keywords = ["mcp", "ast", "tree-sitter", "code-editing", "llm", "refactoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0",
    "rapidfuzz>=3.0.0",
    "ruff",
    "PyYAML>=6.0",
    "json5>=0.9.0",
    "tomli>=2.0; python_version < '3.11'",
    "tree-sitter-language-pack>=0.7.0",
]

[project.urls]
Repository = "https://github.com/loerei/patchitRIGHT"
Issues = "https://github.com/loerei/patchitRIGHT/issues"

[project.scripts]
patchitright-mcp = "patchitright_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchitright_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    ".agents/**",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"
filterwarnings = [
    "ignore::pytest.PytestCacheWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.6.0",
]
